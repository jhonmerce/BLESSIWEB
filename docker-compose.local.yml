services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: station
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: station
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    environment:
      DATABASE_URL: postgresql://station:${POSTGRES_PASSWORD}@db:5432/station
      DIRECT_URL: postgresql://station:${POSTGRES_PASSWORD}@db:5432/station
    depends_on:
      db:
        condition: service_healthy

  api:
    environment:
      DATABASE_URL: postgresql://station:${POSTGRES_PASSWORD}@db:5432/station
      DIRECT_URL: postgresql://station:${POSTGRES_PASSWORD}@db:5432/station

volumes:
  postgres_data:
